global
    log stdout format raw local0 debug
    maxconn 4096
    daemon

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms

frontend http_front
    bind *:80
    bind *:443 ssl crt /usr/local/etc/haproxy/certs/test.local.pem
    acl is_front path_beg /front
    use_backend front_backend if is_front
    default_backend default_backend

backend front_backend
    http-request set-path %[path,regsub(^/front/,/)]
    server test.local frontend:8081

backend default_backend
    http-request deny deny_status 404
