- name: Build and run Docker image with frontend
  hosts: kafka_test[0]
  become: true
  become_user: root
  tasks:
    - name: Remove old Docker packages
      apt:
        name:
          - docker
          - docker-engine
          - docker.io
          - containerd
          - runc
        state: absent
        purge: true

    - name: Install prerequisites
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - nginx
        state: present
        update_cache: true

    - name: Add Docker's official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
        keyring: /usr/share/keyrings/docker-archive-keyring.gpg

    - name: Set up stable repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker-ce-stable

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
        state: present
        update_cache: true

    - name: Manage Docker service
      systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true

    - name: Run test container
      command: docker run --rm hello-world
      register: docker_test
      changed_when: false
    - debug:
        msg: "{{ docker_test.stdout }}"

    - name: Stop host Nginx
      systemd:
        name: nginx
        state: stopped
        enabled: false

    - name: Create SSL directory
      file:
        path: /etc/ssl/test.local
        state: directory
        mode: 0755

    - name: Generate OpenSSL config with SAN
      copy:
        dest: /etc/ssl/test.local/openssl.cnf
        content: |
          [req]
          default_bits = 2048
          prompt = no
          default_md = sha256
          distinguished_name = dn
          req_extensions = req_ext

          [dn]
          C = RU
          ST = Moscow
          L = Moscow
          O =  
          OU =     
          emailAddress =   
          CN = test.local

          [req_ext]
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = test.local
          IP.1 = {{ ansible_host }}

    - name: Generate private key
      openssl_privatekey:
        path: /etc/ssl/test.local/test.local.key
        size: 2048

    - name: Generate CSR
      openssl_csr:
        path: /etc/ssl/test.local/test.local.csr
        privatekey_path: /etc/ssl/test.local/test.local.key
        country_name: RU
        state_or_province_name: Moscow
        locality_name: Moscow
        organization_name: "Example Company"
        organizational_unit_name: "IT Department"
        email_address: admin@test.local
        common_name: test.local
        subject_alt_name:
          - "DNS:test.local"
          - "IP:{{ ansible_host }}"

    - name: Generate self-signed certificate
      openssl_certificate:
        path: /etc/ssl/test.local/test.local.crt
        privatekey_path: /etc/ssl/test.local/test.local.key
        csr_path: /etc/ssl/test.local/test.local.csr
        provider: selfsigned
        selfsigned_not_after: +3650d

    #   copy:
    #     dest: /tmp/frontend/haproxy/key.pem
    #     content: |
    #       {{ lookup('file', '/etc/ssl/test.local/test.local.crt') }}
    #       {{ lookup('file', '/etc/ssl/test.local/test.local.key') }}
    #     owner: root
    #     group: root
    #     mode: '0600'

    - name: Create frontend directory
      file:
        path: /tmp/frontend
        state: directory
        mode: '0755'

    - name: Copy frontend files
      ansible.builtin.copy:
        src: /mnt/d/VSCode/practice/playbooks/frontend-with-nginx/files/root-front-release-1.0.4.tar.gz
        dest: /tmp/frontend/
        owner: root
        group: root
        mode: '0755'

    - name: Extract frontend files
      unarchive:
        src: /tmp/frontend/root-front-release-1.0.4.tar.gz
        dest: /tmp/frontend/
        remote_src: true
        extra_opts: [--strip-components=1]

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: Dockerfile
        dest: /tmp/frontend/Dockerfile
        owner: root
        group: root
        mode: '0644'

    - name: Copy nginx config
      ansible.builtin.copy:
        src: nginx.conf
        dest: /tmp/frontend/nginx.conf
        owner: root
        group: root
        mode: '0644'

    - name: Copy files
      ansible.builtin.copy:
        src: "files/{{ item }}"
        dest: "/opt/docker-stack/"
        mode: 0644
      loop:
        - "docker-compose.yml"
        - "ssl.conf.j2"

    - name: Copy files
      ansible.builtin.copy:
        src: "files/ssl/{{ item }}"
        dest: "/tmp/frontend/"
        mode: 0644
      loop:
        - "test.local.crt"
        - "test.local.key"
        - "ssl.conf.j2"

    - name: Build frontend image
      community.docker.docker_image:
        name: frontend-app
        build:
          path: /tmp/frontend
          pull: true
        source: build
        state: present

    - name: Docker network creation
      community.docker.docker_network:
        name: gitea
        driver: bridge
        state: present

