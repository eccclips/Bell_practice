version: "3"

networks:
  gitea:
    external: true
    driver: bridge

services:
  gitea:
    image: docker.gitea.com/gitea:1.23.5
    container_name: gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=gitea
      - ROOT_URL=https://test.local/gitea/
      # - GITEA__queue__TYPE=kafka
      # - GITEA__queue__BROKER=kafka-1:9092
    restart: always
    networks:
      - gitea
    depends_on:
      - db
    volumes:
      - /var/lib/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "222:22"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-server
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    restart: always
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - gitea

  # haproxy:
  #   image: haproxy:latest
  #   container_name: haproxy
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   restart: always
  #   volumes:
  #     - /tmp/frontend/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
  #     - /tmp/frontend/haproxy/test.local.pem:/usr/local/etc/haproxy/certs/test.local.pem
  #   networks:
  #     - gitea  

  db:
    image: docker.io/library/postgres:16
    container_name: db
    restart: always
    environment:
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=gitea
      - POSTGRES_DB=gitea
    ports:
      - "5432:5432"
    networks:
      - gitea
    volumes:
      - /var/lib/postgres/data:/var/lib/postgresql/data

volumes:
  jenkins_home: