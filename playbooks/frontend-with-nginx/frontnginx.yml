    - name: Run nginx container with node
      community.docker.docker_container:
        name: frontend
        image: frontend-app
        ports:
          - "80:80"
          - "443:443"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: gitea



        
    - name: Create project directory
      ansible.builtin.file:
        path: "/opt/docker-stack"
        state: directory
        mode: 0755

    - name: Copy files
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/opt/docker-stack/"
        mode: 0644
      loop:
        - "docker-compose.yml"
        - "ssl.conf.j2"

    - name: Docker-compose
      community.docker.docker_compose_v2:
        project_src: "/opt/docker-stack"
        pull: always
        build: always
        state: present


        